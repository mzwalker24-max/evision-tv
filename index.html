<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evision TV</title>

<style>

body {

  margin: 0;

  background: #080b12;

  color: white;

  font-family: Arial, sans-serif;

}

.container {

  max-width: 650px;

  margin: auto;

  padding: 60px 30px;

}

.logo {

  text-align: center;

  font-size: 48px;

  font-weight: bold;

  margin-bottom: 10px;

}

.logo span {

  color: #36a3ff;

}

.subtitle {

  text-align: center;

  color: #aaa;

  margin-bottom: 50px;

}

.card {

  background: #121722;

  padding: 35px;

  border-radius: 20px;

}

label {

  display: block;

  margin: 18px 0 8px;

}

input {

  width: 100%;

  box-sizing: border-box;

  padding: 18px;

  border-radius: 10px;

  border: 1px solid #333;

  background: #080b12;

  color: white;

  font-size: 18px;

}

button {

  width: 100%;

  margin-top: 28px;

  padding: 18px;

  border: 0;

  border-radius: 10px;

  background: #168cff;

  color: white;

  font-size: 20px;

  font-weight: bold;

  cursor: pointer;

}

</style>

</head>

<body>

<div class="container">

  <div class="logo">EVISION <span>TV</span></div>

  <div class="subtitle">Entertainment on the road.</div>

  <div class="card">

    <label>Server</label>

    <input

      id="server"

      type="text"

      value="http://hostengine.live:25462"

    >

    <label>Username</label>

    <input

      id="username"

      type="text"

      placeholder="Enter username"

    >

    <label>Password</label>

    <input

      id="password"

      type="password"

      placeholder="Enter password"

    >

    <button onclick="connectTV()">Connect to Evision TV</button>

  </div>

</div>

<div id="channels" style="display:none; padding:20px;">
  <h2>Live TV</h2>
  <div id="channelList"></div>
</div>

<script>

async function connectTV() {
  const server = document.getElementById("server").value.trim();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!server || !username || !password) {
    alert("Please enter your server, username and password.");
    return;
  }

  try {
    const response = await fetch(
      "https://evision-tv-api.mz-walker24.workers.dev/",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          server,
          username,
          password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Login failed");
    }

    const channelResponse = await fetch(

  "https://evision-tv-api.mz-walker24.workers.dev/channels?username=" +

  encodeURIComponent(username) +

  "&password=" +

  encodeURIComponent(password)

);

const channels = await channelResponse.json();

if (!channelResponse.ok) {

  throw new Error(channels.error || "Could not load channels");

}

document.querySelector(".card").style.display = "none";

document.querySelector(".subtitle").style.display = "none";

const channelSection = document.getElementById("channels");

const channelList = document.getElementById("channelList");

channelSection.style.display = "block";

channelList.innerHTML = "";

channels.forEach(channel => {

  const item = document.createElement("div");

  item.style.padding = "15px";

  item.style.marginBottom = "10px";

  item.style.background = "#121722";

  item.style.borderRadius = "10px";

  item.style.cursor = "pointer";

  item.textContent = channel.name || "Channel";

  channelList.appendChild(item);

});

  } catch (error) {
    alert("Connection failed: " + error.message);
  }
}

</script>

</body>

</html>
